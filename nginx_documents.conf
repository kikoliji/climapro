# Afegir aquest bloc dins del server {} del fitxer nginx de Nouaire
# Normalment a: /etc/nginx/sites-available/nouaire
#
# Instruccions:
#   sudo nano /etc/nginx/sites-available/nouaire
#   Afegir el contingut de sota dins del bloc server {}
#   sudo nginx -t
#   sudo systemctl reload nginx

location /documents/ {
    alias /var/www/nouaire/documents/;
    add_header Access-Control-Allow-Origin *;
    add_header Cache-Control "public, max-age=86400";
}

